<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogo Catene - Premium Collection</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary-bg: #000;
      --accent-color: #432338;
      --accent-glow: #5a2e4a;
      --text-primary: #fff;
      --text-secondary: #b0b0b0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--primary-bg);
      color: var(--text-primary);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header {
      position: fixed; top: 0; left: 0;
      width: 100%; padding: 1rem 2rem;
      z-index: 1000; background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo-minerva { height: 35px; }
    .logo-catalogo {
      height: 45px; position: absolute; left: 50%;
      transform: translateX(-50%);
    }
    @media (max-width: 768px) {
      .header {
        flex-direction: column; justify-content: center;
        align-items: center; gap: 0.6rem; padding: 1rem;
      }
      .logo-minerva, .logo-catalogo { position: static; transform: none; }
      .logo-catalogo { height: 40px; }
    }
    .background-wrapper {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: -1;
      background:
        radial-gradient(ellipse at 20% 20%, var(--accent-color) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 80%, var(--accent-glow) 0%, transparent 40%),
        radial-gradient(ellipse at 40% 40%, #2a1a2a 0%, transparent 50%),
        linear-gradient(180deg, #000 0%, #1a0f1a 100%);
    }
    .hero-section { padding: 140px 0 40px; text-align: center; }
    .hero-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; }
    .hero-subtitle { font-size: 1.1rem; color: var(--text-secondary); }
    .filters-section { padding: 2rem 0; }
    .filter-container {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem;
    }
    .custom-dropdown { position: relative; width: 180px; }
    .dropdown-selected {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; padding: 1rem 1.2rem;
      color: var(--text-primary); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .dropdown-selected:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
    }
    .dropdown-arrow { transition: 0.3s; color: var(--text-secondary); }
    .dropdown-arrow.active { transform: rotate(180deg); color: var(--accent-color); }
    .dropdown-options {
      position: absolute; top: 100%; left: 0; right: 0;
      background: rgba(26,15,26,0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      margin-top: 8px; max-height: 300px; overflow-y: auto;
      opacity: 0; visibility: hidden; transform: translateY(-10px);
      transition: all 0.3s ease; z-index: 1000;
    }
    .dropdown-options.active {
      opacity: 1; visibility: visible; transform: translateY(0);
    }
    .dropdown-option {
      padding: 12px 16px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: var(--text-primary);
    }
    .dropdown-option:hover {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-glow));
      color: #fff;
    }
    .prodotti-section { padding: 2rem 0 4rem; }
    .card-prodotto {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 1.5rem;
      transition: 0.3s; height: 100%;
    }
    .card-prodotto:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color);
      box-shadow: 0 10px 30px rgba(67,35,56,0.3);
    }

    /* ✅ MIGLIORIA: contenitore immagini con fallback elegante */
    .prodotto-image {
      height: 120px;
      margin-bottom: 1rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .prodotto-image img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
    .img-fallback {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.75);
      font-size: 0.85rem;
      letter-spacing: 0.2px;
      text-align: center;
      padding: 0 10px;
      background: rgba(255,255,255,0.04);
    }

    .prodotto-codice { font-weight: 600; margin-bottom: 0.5rem; word-break: break-word; overflow-wrap: anywhere; line-height: 1.2;}
    .prodotto-descrizione { color: var(--text-secondary); font-size: 0.85rem; }
    .prodotto-specifiche { font-size: 0.8rem; color: var(--text-secondary); }

    /* === MODAL PRODOTTO === */
    .modal-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      /* ✅ più scuro + più blur (leggibilità mobile) */
      background: rgba(0,0,0,0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center;
      z-index: 9999;
      padding: 16px; /* ✅ evita che tocchi i bordi su mobile */
    }
    .modal-content {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 20px;
      max-width: 90%;
      width: 420px;
      animation: zoomIn 0.25s ease;
    }
    @keyframes zoomIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-content img {
      width: 100%; border-radius: 12px; margin-bottom: 15px;
      cursor: zoom-in;
      display: block;
    }

    /* ✅ fallback elegante anche nel modal */
    .modal-img-wrap {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: none;
      margin-bottom: 5px;
    }
    .modal-img-wrap .img-fallback {
      height: 220px;
      border-radius: 12px;
    }

    .modal-close {
      margin-top: 10px; cursor: pointer;
      text-align: center; font-weight: 600;
      background: rgba(255,255,255,0.1);
      padding: 8px; border-radius: 8px;
    }
    .modal-close:hover { background: rgba(255,255,255,0.2); }

    /* === FULLSCREEN VIEWER === */
    .fullscreen-viewer {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .fullscreen-viewer img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* === BOTTONE TORNA AL CATALOGO === */
    .back-button {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 0.8rem 1.5rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 1000;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      -webkit-appearance: none;
      appearance: none;
    }
    .back-button:hover {
      background: var(--accent-glow);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <header class="header">
    <img src="MinervaHub_LOGO_white.png" class="logo-minerva" />
    <img src="logo_catalogo.png" class="logo-catalogo" />
    <div style="width: 35px"></div>
  </header>

  <div class="background-wrapper"></div>

  <section class="hero-section">
    <h1 class="hero-title" id="gruppoNome">Caricamento...</h1>
    <p class="hero-subtitle" id="contatoreProdotti">0 prodotti trovati</p>
  </section>

  <section class="filters-section">
    <div class="container">
      <div class="filter-container">

        <!-- FILTRI ORIGINALI -->
        <div class="custom-dropdown" id="dropdownAspetto">
          <div class="dropdown-selected"><span class="selected-text">Aspetto</span><span class="dropdown-arrow">⌄</span></div>
          <div class="dropdown-options"></div>
        </div>

        <div class="custom-dropdown" id="dropdownFilo">
          <div class="dropdown-selected"><span class="selected-text">Filo</span><span class="dropdown-arrow">⌄</span></div>
          <div class="dropdown-options"></div>
        </div>

        <div class="custom-dropdown" id="dropdownInternoFilo">
          <div class="dropdown-selected"><span class="selected-text">Interno Filo</span><span class="dropdown-arrow">⌄</span></div>
          <div class="dropdown-options"></div>
        </div>

        <div class="custom-dropdown" id="dropdownMateriale">
          <div class="dropdown-selected"><span class="selected-text">Materiale</span><span class="dropdown-arrow">⌄</span></div>
          <div class="dropdown-options"></div>
        </div>

        <div class="custom-dropdown" id="dropdownDimFilo">
          <div class="dropdown-selected"><span class="selected-text">Dim. Filo</span><span class="dropdown-arrow">⌄</span></div>
          <div class="dropdown-options"></div>
        </div>

        <!-- ⭐️ NUOVO FILTRO LAVORAZIONI -->
        <div class="custom-dropdown" id="dropdownLavorazioni">
          <div class="dropdown-selected"><span class="selected-text">Lavorazioni</span><span class="dropdown-arrow">⌄</span></div>
          <div class="dropdown-options"></div>
        </div>

        <input id="searchInput" type="text" placeholder="Cerca per codice..."
          style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:1rem 1.2rem; width:220px;">
      </div>
    </div>
  </section>

  <section class="prodotti-section">
    <div class="container">
      <div class="row g-3" id="prodotti-container"></div>
    </div>
  </section>

  <button class="back-button" onclick="tornaIndietro()">← Torna al catalogo</button>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalProdotto">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <!-- FULLSCREEN VIEWER -->
  <div class="fullscreen-viewer" id="fullscreenViewer" onclick="chiudiFullscreen()">
    <img id="fullscreenImage" src="">
  </div>

<script src="js/data-loader.js"></script>
<script>
  let prodottiReali = [];
  const dataLoader = new CSVDataLoader();

  function inizializzaDropdown() {
    document.querySelectorAll(".custom-dropdown").forEach(dropdown => {
      const selected = dropdown.querySelector(".dropdown-selected");
      const options = dropdown.querySelector(".dropdown-options");
      const arrow = dropdown.querySelector(".dropdown-arrow");

      selected.addEventListener("click", e => {
        e.stopPropagation();
        options.classList.toggle("active");
        arrow.classList.toggle("active");
      });

      options.querySelectorAll(".dropdown-option").forEach(opt => {
        opt.addEventListener("click", () => {
          dropdown.setAttribute("data-value", opt.dataset.value);
          dropdown.querySelector(".selected-text").textContent = opt.textContent;
          options.classList.remove("active");
          arrow.classList.remove("active");
          applicaFiltri();
        });
      });
    });

    document.addEventListener("click", () => {
      document.querySelectorAll(".dropdown-options").forEach(o => o.classList.remove("active"));
      document.querySelectorAll(".dropdown-arrow").forEach(a => a.classList.remove("active"));
    });
  }

  function popolaDropdown(id, valori) {
    const dropdown = document.getElementById(id);
    const cont = dropdown.querySelector(".dropdown-options");
    cont.innerHTML = "";

    [...new Set(valori.map(v => (v || "").trim().toLowerCase()))]
      .filter(v => v !== "")
      .map(v => v.charAt(0).toUpperCase() + v.slice(1))
      .forEach(val => {
        const opt = document.createElement("div");
        opt.className = "dropdown-option";
        opt.dataset.value = val;
        opt.textContent = val;
        cont.appendChild(opt);
      });
  }

  function popolaFiltriConDatiReali() {
    popolaDropdown("dropdownAspetto", dataLoader.getAspettiUnici());
    popolaDropdown("dropdownFilo", dataLoader.getFiliUnici());
    popolaDropdown("dropdownInternoFilo", dataLoader.getInterniFiloUnici());
    popolaDropdown("dropdownMateriale", dataLoader.getMaterialiUnici());
    popolaDropdown("dropdownDimFilo", dataLoader.getSpessoriUnici());

    // ⭐️ NUOVO: filtro lavorazioni
    popolaDropdown("dropdownLavorazioni", dataLoader.getLavorazioniUniche());

    inizializzaDropdown();
  }

  function getFiltriAttivi() {
    return {
      aspetto:      document.getElementById("dropdownAspetto")?.getAttribute("data-value") || "",
      filo:         document.getElementById("dropdownFilo")?.getAttribute("data-value") || "",
      internoFilo:  document.getElementById("dropdownInternoFilo")?.getAttribute("data-value") || "",
      materiale:    document.getElementById("dropdownMateriale")?.getAttribute("data-value") || "",
      dimFilo:      document.getElementById("dropdownDimFilo")?.getAttribute("data-value") || "",
      lavorazione:  document.getElementById("dropdownLavorazioni")?.getAttribute("data-value") || "",
      ricerca:      document.getElementById("searchInput")?.value.trim().toLowerCase() || ""
    };
  }

  function applicaFiltri() {
    const f = getFiltriAttivi();
    renderizzaProdotti(prodottiReali.filter(p => {
      const n = p.normalizzato;

      const passaLavorazione =
        !f.lavorazione ||
        (n.lavorazioni && n.lavorazioni.toLowerCase().includes(f.lavorazione.toLowerCase()));

      return (
        (!f.aspetto || n.aspetto.toLowerCase() === f.aspetto.toLowerCase()) &&
        (!f.filo || n.filo.toLowerCase() === f.filo.toLowerCase()) &&
        (!f.internoFilo || n.internoFilo.toLowerCase() === f.internoFilo.toLowerCase()) &&
        (!f.materiale || n.materiale.toLowerCase() === f.materiale.toLowerCase()) &&
        (!f.dimFilo || n.spessore.toLowerCase() === f.dimFilo.toLowerCase()) &&
        (!f.ricerca || (n.codice && n.codice.toLowerCase().includes(f.ricerca))) &&
        passaLavorazione
      );
    }));
  }

  /* === FULLSCREEN IMAGE VIEWER === */
  function apriFullscreen(src) {
    const viewer = document.getElementById("fullscreenViewer");
    const img = document.getElementById("fullscreenImage");
    img.src = src;
    viewer.style.display = "flex";
  }

  function chiudiFullscreen() {
    document.getElementById("fullscreenViewer").style.display = "none";
  }

  /* ✅ helper: fallback immagine elegante */
  function imgFallbackHTML(tipo = "card") {
    const testo = "Anteprima non disponibile";
    if (tipo === "modal") {
      return `<div class="modal-img-wrap"><div class="img-fallback" style="height:220px;">${testo}</div></div>`;
    }
    return `<div class="img-fallback">${testo}</div>`;
  }

  /* ✅ handler per immagini rotte: sostituisce il contenitore */
  function handleImgError(imgEl, tipo = "card") {
    const parent = imgEl?.parentElement;
    if (!parent) return;
    parent.innerHTML = imgFallbackHTML(tipo);
  }

  /* === MODAL PRODOTTO === */
  function apriModal(prodotto) {
    const modal = document.getElementById("modalProdotto");
    const content = document.getElementById("modalContent");
    const n = prodotto.normalizzato;

    content.innerHTML = `
      <div class="modal-img-wrap">
        <img src="${n.percorsoImmagine}"
             loading="lazy"
             onclick="apriFullscreen(this.src)"
             onerror="handleImgError(this,'modal')"
             style="cursor: zoom-in;">
      </div>

      <h4 style="color:white; margin-bottom:5px;">${n.codice}</h4>
      <p style="color:#ccc;">${n.descrizione || ""}</p>

      <div style="color:#bbb; font-size:0.85rem;">
        <div><strong>Aspetto:</strong> ${n.aspetto}</div>
        <div><strong>Materiale:</strong> ${n.materiale}</div>
        <div><strong>Filo:</strong> ${n.filo}</div>
        <div><strong>Interno Filo:</strong> ${n.internoFilo}</div>
        <div><strong>Dim. Filo:</strong> ${n.spessore}</div>
        <div><strong>Peso:</strong> ${n.peso} g</div>
        <div><strong>Lavorazioni:</strong> ${n.lavorazioni || "Nessuna"}</div>
      </div>

      <div class="modal-close" onclick="chiudiModal()">Chiudi</div>
    `;

    modal.style.display = "flex";
  }

  function chiudiModal() {
    document.getElementById("modalProdotto").style.display = "none";
  }

  function renderizzaProdotti(prodotti) {
    const container = document.getElementById("prodotti-container");
    const contatore = document.getElementById("contatoreProdotti");
    contatore.textContent = `${prodotti.length} prodotti trovati`;

    container.innerHTML = prodotti.map(prodotto => {
      const n = prodotto.normalizzato;

      return `
        <div class="col-md-6 col-lg-4 col-xl-3">
          <div class="card-prodotto" onclick='apriModal(${JSON.stringify(prodotto).replace(/"/g, "&quot;")})'>
            <div class="prodotto-image">
              <img src="${n.percorsoImmagine}"
                   loading="lazy"
                   onerror="handleImgError(this,'card')"
                   style="width:100%; height:120px; object-fit:cover; border-radius:8px;">
            </div>

            <div class="prodotto-codice">${n.codice}</div>
            <div class="prodotto-descrizione">${n.descrizione || ""}</div>

            <div class="prodotto-specifiche">
              <div><strong>Aspetto:</strong> ${n.aspetto}</div>
              <div><strong>Materiale:</strong> ${n.materiale}</div>
              <div><strong>Filo:</strong> ${n.filo}</div>
              <div><strong>Interno Filo:</strong> ${n.internoFilo}</div>
              <div><strong>Dim. Filo:</strong> ${n.spessore}</div>
              <div><strong>Peso:</strong> ${n.peso} g</div>
              <div><strong>Lavorazioni:</strong> ${n.lavorazioni || "—"}</div>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  async function caricaDatiGruppo() {
    const params = new URLSearchParams(window.location.search);
    const nome = params.get("nome");
    document.getElementById("gruppoNome").textContent = nome;
    document.title = `Catalogo ${nome}`;

    if (nome?.toLowerCase() === "chiusure") {
      document.getElementById("searchInput").style.display = "none";
    }

    await dataLoader.caricaCSV();
    prodottiReali = dataLoader.getProdottiPerCategoria(nome);
    renderizzaProdotti(prodottiReali);
    popolaFiltriConDatiReali();
  }

  document.addEventListener("DOMContentLoaded", () => {
    caricaDatiGruppo();
    document.getElementById("searchInput")?.addEventListener("input", applicaFiltri);
  });

  function tornaIndietro() { window.location.href = "index.html"; }
</script>

</body>
</html>
